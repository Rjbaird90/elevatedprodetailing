
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gallery | Elevated Pro Detailing</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:#050505;
      color:white;
      font-family:Arial, Helvetica, sans-serif;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    .wrap{
      width:min(1120px, calc(100% - 32px));
      margin:0 auto;
    }

    header{
      border-bottom:1px solid rgba(214,168,60,.3);
      background:#000;
      position:sticky;
      top:0;
      z-index:10;
    }

    .nav{
      min-height:80px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
    }

    .logo{
      width:250px;
      max-width:58vw;
      display:block;
    }

    .nav-links{
      display:flex;
      align-items:center;
      gap:18px;
      font-size:14px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#c9c1ad;
    }

    .nav-links a:hover{
      color:#c9a227;
    }

    .call-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:14px 22px;
      border-radius:999px;
      background:linear-gradient(135deg,#c9a227,#996515);
      color:#000;
      font-weight:800;
      white-space:nowrap;
    }

    .hero{
      text-align:center;
      padding:60px 20px 25px;
    }

    h1{
      color:#c9a227;
      font-size:52px;
      margin:10px 0;
      letter-spacing:2px;
    }

    .sub{
      color:#c9c1ad;
      margin-bottom:20px;
    }

    .gallery{
      width:min(1200px, calc(100% - 30px));
      margin:40px auto 50px;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(min(100%, 320px),1fr));
      gap:22px;
    }

    .gallery img{
      display:block;
      width:100%;
      height:auto;
      border-radius:18px;
      border:1px solid rgba(214,168,60,.35);
      box-shadow:0 20px 50px rgba(0,0,0,.45);
      cursor:pointer;
      transition:.25s ease;
    }

    .gallery img:hover{
      transform:scale(1.02);
    }

    footer{
      text-align:center;
      padding:30px;
      color:#999;
    }

    .lightbox{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.92);
      z-index:9999;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .lightbox img{
      max-width:95%;
      max-height:95%;
      border-radius:18px;
      border:2px solid #c9a227;
      cursor:default;
    }

    .lightbox-close{
      position:absolute;
      top:18px;
      right:20px;
      width:44px;
      height:44px;
      border:1px solid rgba(214,168,60,.65);
      border-radius:50%;
      background:rgba(0,0,0,.65);
      color:#c9a227;
      font-size:30px;
      line-height:1;
      cursor:pointer;
    }

    .lightbox-close:hover{
      background:#c9a227;
      color:#000;
    }

    @media(max-width:900px){
      .nav{
        flex-direction:column;
        gap:15px;
        padding:15px 0;
      }

      .nav-links{
        flex-wrap:wrap;
        justify-content:center;
        gap:12px;
        font-size:12px;
      }

      .call-btn{
        margin-bottom:5px;
      }

      h1{
        font-size:42px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="wrap nav">

    <a href="index.html">
      <img src="new elevated 2.png" alt="Elevated Pro Detailing" class="logo">
    </a>

    <nav class="nav-links">
      <a href="index.html#services">Services</a>
      <a href="index.html#pricing">Pricing</a>
      <a href="index.html#addons">Add-ons</a>
      <a href="gallery.html">Gallery</a>
      <a href="reviews.html">Reviews</a>
      <a href="index.html#contact">Contact</a>
      <a href="Appointment.html">Book Appointment</a>
    </nav>

    <a class="call-btn" href="tel:2624907620">
      Call 262-490-7620
    </a>

  </div>
</header>

<section class="hero">
  <h1>Gallery</h1>
  <div class="sub">
    Before & after transformations from Elevated Pro Detailing
  </div>
</section>

<section class="gallery">

  <img src="Mike Before & After2.png" alt="Mike vehicle before and after detail" onclick="openLightbox(this)">

  <img src="Tasha Before & After1.png" alt="Tasha vehicle before and after detail" onclick="openLightbox(this)">

  <img src="Before & After 4 pic2.png" alt="Four-photo vehicle before and after detail collage" onclick="openLightbox(this)">

  <img src="Between Seats B&A.jpg" alt="Between seats before and after interior cleaning" onclick="openLightbox(this)">

  <img src="Before & After 4 pic Cheryl.jpg" alt="Cheryl vehicle before and after detail collage" onclick="openLightbox(this)">

  <img src="Before & After Work Van1.png" alt="Work van before and after detail view one" onclick="openLightbox(this)">

  <img src="Before & After Work Van2.png" alt="Work van before and after detail view two" onclick="openLightbox(this)">

</section>

<footer>
  Elevated Pro Detailing
</footer>

<div id="lightbox" class="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" type="button" aria-label="Close gallery image" onclick="closeLightbox()">&times;</button>
  <img id="lightbox-img" alt="" onclick="event.stopPropagation()">
</div>

<script>
function openLightbox(image){
  const lightbox = document.getElementById('lightbox');
  const lightboxImage = document.getElementById('lightbox-img');

  lightbox.style.display='flex';
  lightboxImage.src=image.src;
  lightboxImage.alt=image.alt;
}

function closeLightbox(){
  document.getElementById('lightbox').style.display='none';
}

document.addEventListener('keydown', function(event){
  if(event.key === 'Escape'){
    closeLightbox();
  }
});
</script>

</body>
</html>
